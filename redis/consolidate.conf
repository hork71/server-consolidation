# Redis configuration for the consolidated host.
#
# Append the following line to the END of /etc/redis/redis.conf so these
# settings override the packaged defaults:
#
#     include /etc/redis/consolidate.conf
#
# Only flask-4 uses this instance, and it uses it strictly as a cache.

# ---- network -----------------------------------------------------------
# Loopback only. Never reachable from the LAN.
bind 127.0.0.1 -::1
port 6379
protected-mode yes

# ---- cache semantics ---------------------------------------------------
# A fixed ceiling with LRU eviction. Without maxmemory, Redis grows until
# the host runs out of memory and the OOM killer picks a victim, which will
# not necessarily be Redis.
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---- persistence: disabled --------------------------------------------
# This is a cache. Nothing in it is worth preserving across a restart, and
# disabling persistence removes fork-related latency spikes and disk I/O.
#
# PRECONDITION: flask-4 must not keep sessions here. If it does, a restart
# logs every user out. Confirm before cutover — see §6 of the plan.
save ""
appendonly no

# ---- logging -----------------------------------------------------------
# To the journal, like everything else.
logfile ""
loglevel notice

# ---- safety ------------------------------------------------------------
# Disabling administrative commands is available but left off deliberately:
# the instance is loopback-only with protected-mode on, so the exposure is
# already small, and renaming CONFIG breaks client libraries and monitoring
# tools that query it during normal operation. Enable only if a specific
# threat model calls for it.
#
# rename-command FLUSHALL ""
# rename-command DEBUG ""

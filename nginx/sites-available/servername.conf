# Cache policy for static assets, keyed on the request path.
#
# This lives at http level because `map` is only valid there — which is also
# why the per-application files in apps.d/ cannot define it themselves.
# Hashed build assets are cached hard; everything else (index.html above all)
# must revalidate, or clients pin to a stale build after a deploy.
map $uri $asset_expires {
    default                                                            -1;
    ~*\.(?:css|js|mjs|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|ico)$  1y;
}

# Single public entry point for all nine consolidated applications.
#
# Per-application location blocks live in /etc/nginx/apps.d/ and are pulled in
# by the include below. nginx matches locations by longest prefix, not by file
# order, so the include position does not affect routing.

server {
    listen      80;
    listen      [::]:80;
    server_name servername.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name servername.example.com;

    ssl_certificate     /etc/ssl/certs/servername.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/servername.key;
    include             snippets/tls_common.conf;

    root  /data/www/landing;
    index index.html;

    client_max_body_size 25m;

    access_log /var/log/nginx/servername.access.log;
    error_log  /var/log/nginx/servername.error.log;

    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       text/plain text/css text/xml application/json
                     application/javascript application/xml+rss
                     image/svg+xml;

    # Landing page listing the nine applications. Without this, the bare
    # hostname returns 404 and reads as a broken server.
    location = / {
        try_files /index.html =404;
    }

    # Per-application routing: static-a, static-b, flask-1..4,
    # node-1, node-2, rails.
    include /etc/nginx/apps.d/*.conf;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

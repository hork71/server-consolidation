# node-2 — loopback TCP on 8002.
#
# No trailing slash or URI on proxy_pass: that is what forwards /node-2/
# through to the application rather than stripping it.

location /node-2/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header X-Forwarded-Prefix /node-2;
    include snippets/proxy_common.conf;
}

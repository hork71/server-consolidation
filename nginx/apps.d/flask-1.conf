# flask-1 — gunicorn over a unix socket.
#
# The trailing colon after the socket path with NOTHING after it is what
# preserves /flask-1/ in the path forwarded upstream. Adding a slash
# (…gunicorn.sock:/) strips the prefix and breaks every generated URL.

# The application's own assets reference each other document-relatively
# ("static/app.js", "api/stats"), which resolves against the directory the
# page was served from. That only works if the page IS served from a path
# ending in a slash, so bare /flask-1 must not be allowed to render.
location = /flask-1 {
    return 301 /flask-1/;
}

# Assets straight from disk — gunicorn never sees an asset request.
# Longest-prefix match wins in nginx, so this takes precedence over the
# /flask-1/ block below regardless of the order they appear in.
#
# Deliberately NOT using $asset_expires here: these filenames are not
# content-hashed (app.js, style.css keep their names across releases), so a
# one-year immutable cache would pin browsers to a stale build after every
# deploy. no-cache still allows caching — it just forces a revalidation,
# which nginx answers with a 304 from the ETag. Cheap, and always correct.
location /flask-1/static/ {
    alias /data/apps/flask-1/current/static/;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}

location /flask-1/ {
    proxy_pass http://unix:/run/flask-1/gunicorn.sock:;
    proxy_set_header X-Forwarded-Prefix /flask-1;
    include snippets/proxy_common.conf;
}

# node-1 — loopback TCP on 8001.
#
# No trailing slash or URI on proxy_pass: that is what forwards /node-1/
# through to the application rather than stripping it.

location /node-1/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header X-Forwarded-Prefix /node-1;
    include snippets/proxy_common.conf;
}

# rails — Puma over a unix socket, with precompiled assets served from disk.
#
# Serving assets here means Puma never handles an asset request. This is the
# main concrete advantage of running natively rather than in a container: the
# release directory is on the host filesystem where nginx can read it.

location /rails/assets/ {
    alias /data/apps/rails/current/public/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Re-declared because this block sets add_header, which suppresses
    # inheritance of the headers from tls_common.conf.
    add_header X-Content-Type-Options nosniff                        always;
    add_header X-Frame-Options        SAMEORIGIN                     always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
    access_log off;
}

location /rails/ {
    proxy_pass http://unix:/run/rails/puma.sock:;
    proxy_set_header X-Forwarded-Prefix /rails;
    include snippets/proxy_common.conf;
}

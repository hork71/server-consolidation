# flask-4 — gunicorn over a unix socket.
#
# The trailing colon after the socket path with NOTHING after it is what
# preserves /flask-4/ in the path forwarded upstream. Adding a slash
# (…gunicorn.sock:/) strips the prefix and breaks every generated URL.

location /flask-4/ {
    proxy_pass http://unix:/run/flask-4/gunicorn.sock:;
    proxy_set_header X-Forwarded-Prefix /flask-4;
    include snippets/proxy_common.conf;
}

# flask-3 — gunicorn over a unix socket.
#
# The trailing colon after the socket path with NOTHING after it is what
# preserves /flask-3/ in the path forwarded upstream. Adding a slash
# (…gunicorn.sock:/) strips the prefix and breaks every generated URL.

location /flask-3/ {
    proxy_pass http://unix:/run/flask-3/gunicorn.sock:;
    proxy_set_header X-Forwarded-Prefix /flask-3;
    include snippets/proxy_common.conf;
}

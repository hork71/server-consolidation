# static-a — static HTML/JavaScript, served directly from disk. No backend process.
#
# try_files falls back to the app's own index.html so client-side routing
# works. If static-a is not a single-page app, drop the final fallback argument.
#
# Caching is driven by $asset_expires, a map defined at http level in
# servername.conf: hashed assets get a year, index.html revalidates. A nested
# regex location would NOT inherit the alias below the way the nesting
# suggests, which is why the policy is expressed as a map instead.

location /static-a/ {
    alias /data/www/static-a/;
    try_files $uri $uri/ /static-a/index.html;
    expires $asset_expires;
}

# Shared proxy behaviour for every application.
# Included from each file in /etc/nginx/apps.d/.
#
# X-Forwarded-Prefix is deliberately NOT set here: it differs per application
# and is set in the individual apps.d file alongside proxy_pass.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Do not buffer the upstream response to disk for large replies; these are
# small internal apps and disk buffering only adds latency.
proxy_buffering       on;
proxy_buffer_size     8k;
proxy_buffers         16 8k;

# Never pass the upstream's Server header through.
proxy_hide_header     X-Powered-By;

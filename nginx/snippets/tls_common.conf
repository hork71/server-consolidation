# TLS parameters and security headers. Included once per server block.
#
# NOTE ON add_header: headers set here are inherited by a location block ONLY
# if that location sets no add_header of its own. /rails/assets/ sets
# Cache-Control, so it re-declares the security headers too. If you add another
# location with add_header, do the same there.

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

# Certificate is issued by the internal enterprise CA, so OCSP stapling has no
# public responder to reach. Leave it off.
ssl_stapling             off;

add_header X-Content-Type-Options nosniff                        always;
add_header X-Frame-Options        SAMEORIGIN                     always;
add_header Referrer-Policy        strict-origin-when-cross-origin always;

# HSTS is deliberately omitted: certificate renewal is manual (no ACME on an
# isolated network), and a cached max-age turns a missed renewal into an
# outage that no server-side change can undo. Enable only with a renewal
# process you trust.
# add_header Strict-Transport-Security "max-age=86400" always;

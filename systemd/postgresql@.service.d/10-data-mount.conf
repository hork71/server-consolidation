# Drop-in for the packaged PostgreSQL unit.
# Install to /etc/systemd/system/postgresql@.service.d/10-data-mount.conf
#
# The cluster's data directory lives on /data. PostgreSQL must not be allowed
# to start before that disk is mounted: it would either fail to find the
# cluster, or — if the mount silently did not happen — find the empty
# mountpoint underneath and refuse to start with a confusing error.

[Unit]
RequiresMountsFor=/data

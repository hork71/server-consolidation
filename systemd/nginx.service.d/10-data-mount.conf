# Drop-in for the packaged nginx unit.
# Install to /etc/systemd/system/nginx.service.d/10-data-mount.conf
#
# nginx serves the two static applications and the landing page from
# /data/www. Without the mount dependency it would start happily and return
# 404 for all of them, which looks like an application fault rather than a
# storage one.

[Unit]
RequiresMountsFor=/data

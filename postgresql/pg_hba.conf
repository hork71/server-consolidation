# PostgreSQL client authentication for the consolidated host.
#
# Install to /etc/postgresql/16/main/pg_hba.conf (the install-configs.sh
# script backs up the original first).
#
# First match wins, so order is significant. Nothing beyond loopback is
# listed, and listen_addresses is 'localhost', so the database is unreachable
# from the LAN at two independent layers.

# TYPE  DATABASE  USER      ADDRESS        METHOD

# Local maintenance as the postgres system user.
local   all       postgres                 peer

# Application connections over the local unix socket.
local   all       all                      scram-sha-256

# Application connections over loopback TCP.
host    all       all       127.0.0.1/32   scram-sha-256
host    all       all       ::1/128        scram-sha-256

# Replication is unused on a single host.
local   replication  all                   peer

# No other rules. Any connection not matched above is rejected.

# Drop-in for /etc/postgresql/16/main/conf.d/10-consolidate.conf
#
# Ubuntu's packaged postgresql.conf ends with include_dir = 'conf.d',
# so this file is read last and its settings win.

# ---- data directory ----------------------------------------------------
# NOT set here on purpose. The cluster lives on the separate /data disk, and
# pg_createcluster records data_directory in the main postgresql.conf when
# setup-data-disk.sh builds it. Defining it again here would shadow that and
# make the real location hard to find. Verify with:
#     sudo -u postgres psql -c 'SHOW data_directory'

# ---- connections -------------------------------------------------------
# Loopback only. Applications run natively on this host; nothing external
# ever needs to connect.
listen_addresses = 'localhost'
port = 5432

# Seven applications, each with a small pool. 100 is ample; raise only with
# evidence from pg_stat_activity.
max_connections = 100

# ---- authentication ----------------------------------------------------
password_encryption = scram-sha-256

# ---- memory ------------------------------------------------------------
# Starting points for a 16 GB host also running seven applications.
# PostgreSQL is not the dominant consumer here — keep it modest and tune
# from pg_stat_statements rather than guessing upward.
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 256MB

# ---- write-ahead log ---------------------------------------------------
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB

# ---- planner -----------------------------------------------------------
# SSD storage: random reads cost roughly the same as sequential.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---- logging -----------------------------------------------------------
# Logs go to the journal alongside nginx and every application unit, so
# journalctl is the single tool for investigating anything.
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0

# ---- autovacuum --------------------------------------------------------
autovacuum = on
log_autovacuum_min_duration = 1000

# ---- timezone ----------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
